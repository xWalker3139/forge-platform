{{- if .Values.progressiveDelivery.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Release.Name }}-success-rate
spec:
  metrics:
    - name: application-success-rate
      interval: 30s
      count: 3
      successCondition: len(result) == 1 && result[0] >= 0.99
      failureLimit: 1
      provider:
        prometheus:
          address: {{ .Values.progressiveDelivery.prometheusURL | quote }}
          query: |
            sum(rate(forge_http_requests_total{service="{{ .Release.Name }}",status!~"5.."}[2m]))
            /
            sum(rate(forge_http_requests_total{service="{{ .Release.Name }}"}[2m]))
{{- end }}
